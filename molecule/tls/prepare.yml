---
# The TLS fixtures are split between the control machine and the target.
#
# Control machine (first play):
#   Generates a test CA, a server certificate, a client certificate, and a
#   self-signed client certificate in `tls_src_dir`, defined once in
#   molecule.yml. The CA private key stays here.
#
# Target (second play):
#   Uploads the client files that the verify tests connect with into
#   /root/redis-tls-client, outside the directory the role manages.
#
# Nothing in prepare writes to /etc/redis/tls. The role creates that directory
# and uploads the server certificate, the private key, and the CA certificate
# from `tls_src_dir` during converge, the same way the production playbooks do.
# A passing test therefore proves the role's upload, not the fixture's.

- name: Generate TLS certificates on the control machine
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Include TLS certificate generation tasks
      include_tasks: tasks/certificates.yml

- name: Prepare TLS client files
  hosts: all
  become: true

  vars:
    tls_client_dir: /root/redis-tls-client

  tasks:
    - name: Create the client directory
      file:
        path: "{{ tls_client_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Upload the client files that the verify tests connect with
      copy:
        src: "{{ tls_src_dir }}/{{ item.src }}"
        dest: "{{ tls_client_dir }}/{{ item.src }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: ca.crt, mode: "0644" }
        - { src: client.crt, mode: "0644" }
        - { src: client.key, mode: "0600" }
        - { src: invalid-client.crt, mode: "0644" }
        - { src: invalid-client.key, mode: "0600" }
