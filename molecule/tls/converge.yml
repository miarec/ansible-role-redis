---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Define Redis variables
      set_fact:
        redis_install_from_source: false
        redis_tls_enabled: true
        redis_tls_cert: /etc/redis/tls/server.crt
        redis_tls_key: /etc/redis/tls/server.key
        redis_tls_ca_cert: /etc/redis/tls/ca.crt
        redis_tls_auth_clients: true
        # The role creates /etc/redis/tls and uploads the server files from
        # the control machine (see prepare.yml and molecule.yml).
        redis_tls_cert_src: "{{ tls_src_dir }}/server.crt"
        redis_tls_key_src: "{{ tls_src_dir }}/server.key"
        redis_tls_ca_cert_src: "{{ tls_src_dir }}/ca.crt"

    - name: Install prerequisites
      block:
        - name: Update apt cache
          when: ansible_facts["os_family"] == "Debian"
          apt:
            update_cache: true
            cache_valid_time: 600
          changed_when: false

  roles:
    - role: "{{ playbook_dir }}/../.." # noqa: role-name[path]
      tags:
        - redis

  post_tasks:
    # Inventories and -e pass booleans as strings. A plain Jinja test treats
    # the string "false" as true, so check that the template casts the value.
    - name: Check that a string "false" turns off client certificate checks
      vars:
        rendered: >-
          {{ lookup('template', playbook_dir ~ '/../../templates/redis.conf.j2',
                    template_vars={'redis_tls_auth_clients': 'false'}) }}
      assert:
        that:
          - "'tls-auth-clients no' in rendered"
          - "'tls-auth-clients yes' not in rendered"
