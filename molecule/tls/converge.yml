---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Define Redis variables
      set_fact:
        redis_install_from_source: false
        redis_make_tls: true
        redis_tls_cert: /etc/redis/tls/server.crt
        redis_tls_key: /etc/redis/tls/server.key
        redis_tls_ca_cert: /etc/redis/tls/ca.crt
        redis_tls_auth_clients: true
        # The role uploads the server files from the control machine (see prepare.yml)
        redis_tls_cert_src: "{{ tls_src_dir }}/server.crt"
        redis_tls_key_src: "{{ tls_src_dir }}/server.key"
        redis_tls_ca_cert_src: "{{ tls_src_dir }}/ca.crt"
      vars:
        tls_src_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls"

    - name: Install prerequisites
      block:
        - name: Update apt cache
          when: ansible_facts["os_family"] == "Debian"
          apt:
            update_cache: true
            cache_valid_time: 600
          changed_when: false

  roles:
    - role: "{{ playbook_dir }}/../.." # noqa: role-name[path]
      tags:
        - redis
