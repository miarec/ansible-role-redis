---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ansible-role-redis-tls
    image: ghcr.io/miarec/${MOLECULE_DISTRO:-ubuntu2404}-systemd:latest
    command: ${MOLECULE_DOCKER_COMMAND:-"/sbin/init"}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    environment:
      container: docker
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    keep_volumes: false
provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
  inventory:
    group_vars:
      all:
        # Where prepare.yml generates the test certificates on the control
        # machine, and where converge.yml uploads them from. Inventory group
        # vars reach every play, including the one that targets localhost.
        tls_src_dir: ${MOLECULE_EPHEMERAL_DIRECTORY}/tls
  env:
    ANSIBLE_VERBOSITY: ${MOLECULE_ANSIBLE_VERBOSITY:-0}
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
verifier:
  name: testinfra
  options:
    s: true
    verbose: true
