---
# Generate a test PKI on the control machine. These tasks run in the
# `hosts: localhost` play of prepare.yml and write to `tls_src_dir` only.
# Nothing here touches the target.
#
# Layout of tls_src_dir/:
#   ca.key, ca.crt                     The test CA. The key never leaves the
#                                      control machine.
#   server.key, server.crt             Server certificate. The role uploads
#                                      these, with ca.crt, during converge.
#   client.key, client.crt             Client certificate signed by the CA.
#                                      prepare.yml uploads these for the
#                                      verify tests.
#   invalid-client.key, invalid-client.crt
#                                      Self-signed client certificate, which
#                                      Redis must reject.
#
# Every command has `creates:`, so a second `molecule prepare` reuses the CA
# and the client and server certificates keep chaining to it.

- name: Create certificate directory
  file:
    path: "{{ tls_src_dir }}"
    state: directory
    mode: "0700"

# ============ CA ============
- name: Generate CA private key
  command: openssl genrsa -out {{ tls_src_dir }}/ca.key 4096
  args:
    creates: "{{ tls_src_dir }}/ca.key"

- name: Generate CA certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ tls_src_dir }}/ca.key
    -sha256 -days 365
    -out {{ tls_src_dir }}/ca.crt
    -subj "/CN=Redis-Test-CA"
  args:
    creates: "{{ tls_src_dir }}/ca.crt"

# ============ Server certificate ============
# Redis runs on the target and listens on the loopback interface, so the
# certificate is issued for localhost.
- name: Generate server private key
  command: openssl genrsa -out {{ tls_src_dir }}/server.key 2048
  args:
    creates: "{{ tls_src_dir }}/server.key"

- name: Create server certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = localhost

      [v3_req]
      keyUsage = keyEncipherment, dataEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = @alt_names

      [alt_names]
      DNS.1 = localhost
      IP.1 = 127.0.0.1
    dest: "{{ tls_src_dir }}/server.cnf"
    mode: "0644"

- name: Generate server CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/server.key
    -out {{ tls_src_dir }}/server.csr
    -config {{ tls_src_dir }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/server.csr"

- name: Sign server certificate with CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/server.csr
    -CA {{ tls_src_dir }}/ca.crt
    -CAkey {{ tls_src_dir }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/server.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/server.cnf
  args:
    creates: "{{ tls_src_dir }}/server.crt"

# ============ Client certificate ============
- name: Generate client private key
  command: openssl genrsa -out {{ tls_src_dir }}/client.key 2048
  args:
    creates: "{{ tls_src_dir }}/client.key"

- name: Create client certificate config
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = redis-client

      [v3_req]
      keyUsage = digitalSignature
      extendedKeyUsage = clientAuth
    dest: "{{ tls_src_dir }}/client.cnf"
    mode: "0644"

- name: Generate client CSR
  command: >
    openssl req -new
    -key {{ tls_src_dir }}/client.key
    -out {{ tls_src_dir }}/client.csr
    -config {{ tls_src_dir }}/client.cnf
  args:
    creates: "{{ tls_src_dir }}/client.csr"

- name: Sign client certificate with CA
  command: >
    openssl x509 -req
    -in {{ tls_src_dir }}/client.csr
    -CA {{ tls_src_dir }}/ca.crt
    -CAkey {{ tls_src_dir }}/ca.key
    -CAcreateserial
    -out {{ tls_src_dir }}/client.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile {{ tls_src_dir }}/client.cnf
  args:
    creates: "{{ tls_src_dir }}/client.crt"

# ============ Invalid client certificate ============
# Self-signed, not signed by the CA, so Redis must reject it.
- name: Generate invalid client private key
  command: openssl genrsa -out {{ tls_src_dir }}/invalid-client.key 2048
  args:
    creates: "{{ tls_src_dir }}/invalid-client.key"

- name: Generate invalid client certificate
  command: >
    openssl req -x509 -new -nodes
    -key {{ tls_src_dir }}/invalid-client.key
    -sha256 -days 365
    -out {{ tls_src_dir }}/invalid-client.crt
    -subj "/CN=invalid-client"
  args:
    creates: "{{ tls_src_dir }}/invalid-client.crt"
