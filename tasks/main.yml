---
- name: Set OS Specific variables and execute variable checks
  include_tasks: preflight.yml

- name: Install Redis from package.
  include_tasks: install-package.yml
  when:
    - not redis_install_from_source
    - _installed_redis.rc != 0 or redis_force_install|bool

- name: Install from Redis from source.
  include_tasks: install-source.yml
  when:
    - redis_install_from_source
    - _installed_redis.rc != 0 or redis_force_install|bool

# Runs on every play, not only on install, so a renewed certificate reaches the
# host and restarts Redis. The install tasks above create the Redis group. The
# role sets permissions only on the files it uploads; a file that is already
# on the host is left as is.
- name: Upload TLS files.
  include_tasks: tls_upload.yml
  when: redis_make_tls | bool

# Runs after the Redis user exists and before the configuration is written,
# so a failure leaves the host untouched.
- name: Verify the TLS files are readable.
  include_tasks: tls_verify.yml
  when: redis_make_tls | bool

- name: Configure Redis.
  include_tasks: configure.yml
  when:
    - _installed_redis.rc != 0 or redis_force_install|bool
